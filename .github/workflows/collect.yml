name: Collect real research data
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/collect.yml', 'regime/collect.py', 'regime/binance_archive.py', 'regime/forward.py', 'regime/readiness.py']
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: write
concurrency:
  group: research-data-collector
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          path: source
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: source/requirements-lock.txt
      - run: pip install -r source/requirements-lock.txt
      - name: Prepare dedicated snapshot worktree
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin research-data; then
            git fetch origin research-data
            git worktree add --detach ../archive FETCH_HEAD
          else
            git worktree add --detach ../archive HEAD
            git -C ../archive switch --orphan research-data
          fi
      - name: Collect independently of the dashboard
        id: collect
        working-directory: source
        continue-on-error: true
        env:
          REGIME_RAW_DIR: ${{ runner.temp }}/market-raw
        run: python -m regime.collect --root ../archive/snapshots
      - name: Publish valid snapshots and failure status
        if: always() && steps.collect.outcome != 'skipped'
        working-directory: archive
        shell: bash
        run: |
          set -euo pipefail
          test -f snapshots/collection-status.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          printf '%s\n' '{"git":{"deploymentEnabled":false}}' > vercel.json
          git add snapshots vercel.json
          if ! git diff --cached --quiet; then
            git commit -m 'Archive real market observations'
            git push origin HEAD:refs/heads/research-data
          fi
      - name: Report partial failure
        if: steps.collect.outcome == 'failure'
        run: exit 1
