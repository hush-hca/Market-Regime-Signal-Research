name: Validate research MVP
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - run: pip install -r requirements-lock.txt
      - run: python -m pytest -q --junitxml=test-results.xml
      - name: Publish readable test failures
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          path=Path('test-results.xml')
          if path.exists():
              for case in ET.parse(path).iter('testcase'):
                  for failure in list(case.findall('failure'))+list(case.findall('error')):
                      message=case.get('classname','')+'.'+case.get('name','')+'\n'+(failure.text or failure.get('message',''))
                      message=message.replace('%','%25').replace('\r','%0D').replace('\n','%0A')
                      print('::error::'+message[:60000])
          PY
